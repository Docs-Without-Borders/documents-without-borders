[build]
  publish = "."

[[redirects]]
  from = "https://www.documentswithoutborders.org"
  to = "https://documentswithoutborders.org"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
